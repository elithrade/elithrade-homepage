name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name "test" is the status check required by branch protection on
  # main. Renaming it means updating the required check in repo settings.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Vitest doesn't type-check, and this is where a content/cv.json of the
      # wrong shape is rejected.
      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
